<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Segoe UI','Yu Gothic UI','Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="区間 P(i) → P(i+1) の制御点を、通過点での接線から求める">
  <title>区間 P(i) → P(i+1) の制御点を、通過点での接線から求める</title>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d55"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="480" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#24292f">区間 P(i) → P(i+1) の制御点の求め方</text>
  <path d="M70,300 C107.6,233.8 145.1,167.6 210,140 C274.9,112.4 367.1,123.6 430,160 C492.9,196.4 526.4,258.2 560,320" fill="none" stroke="#9ab7e6" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="70,300 210,140 430,160 560,320" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="210" y1="140" x2="356" y2="78" stroke="#d1495b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <line x1="430" y1="160" x2="288.5" y2="78" stroke="#2a9d55" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
  <line x1="210" y1="140" x2="274.9" y2="112.4" stroke="#d1495b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="430" y1="160" x2="367.1" y2="123.6" stroke="#2a9d55" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M210,140 C274.9,112.4 367.1,123.6 430,160" fill="none" stroke="#1f6feb" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="269.9" y="107.4" width="10" height="10" fill="#ffffff" stroke="#d1495b" stroke-width="2.5"/>
  <rect x="362.1" y="118.6" width="10" height="10" fill="#ffffff" stroke="#2a9d55" stroke-width="2.5"/>
  <text x="274.9" y="98.4" font-size="15" font-weight="600" fill="#d1495b" text-anchor="middle">C1</text>
  <text x="367.1" y="109.6" font-size="15" font-weight="600" fill="#2a9d55" text-anchor="middle">C2</text>
  <circle cx="70" cy="300" r="5" fill="#57606a"/>
  <text x="70" y="328" font-size="16" font-weight="600" fill="#57606a" text-anchor="middle">P(i−1)</text>
  <circle cx="210" cy="140" r="5" fill="#24292f"/>
  <text x="180" y="146" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">P(i)</text>
  <circle cx="430" cy="160" r="5" fill="#24292f"/>
  <text x="468" y="166" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">P(i+1)</text>
  <circle cx="560" cy="320" r="5" fill="#57606a"/>
  <text x="560" y="348" font-size="16" font-weight="600" fill="#57606a" text-anchor="middle">P(i+2)</text>
  <text x="362" y="70" font-size="13" fill="#d1495b">接線 m(i)</text>
  <text x="282.5" y="70" font-size="13" fill="#2a9d55" text-anchor="end">−m(i+1)</text>
  <text x="320" y="190" font-size="14" font-weight="600" fill="#1f6feb" text-anchor="middle">描かれる区間</text>
  <rect x="24" y="382" width="592" height="78" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="410" font-size="15" fill="#24292f"><tspan fill="#d1495b" font-weight="700">C1 = P(i) + m(i) / 3</tspan>　<tspan fill="#2a9d55" font-weight="700">C2 = P(i+1) − m(i+1) / 3</tspan></text>
  <text x="40" y="438" font-size="14" fill="#57606a">接線 m は連立方程式で全体から決める (破線の矢印は m の 3/4 の長さで描いている)</text>
</svg>
