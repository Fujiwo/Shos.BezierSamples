<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Segoe UI','Yu Gothic UI','Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="通過点の列全体をベジエ曲線でつなぐ">
  <title>通過点の列全体をベジエ曲線でつなぐ</title>
