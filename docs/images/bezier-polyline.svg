  <path d="M150,120 C186.7,113.3 230,233.3 270,230" fill="none" stroke="#1f6feb" stroke-width="4" stroke-linecap="round"/>
  <rect x="183.2" y="109.8" width="7" height="7" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <rect x="226.5" y="229.8" width="7" height="7" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
