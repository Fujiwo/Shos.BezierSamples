  <polyline points="50,270 150,120 270,230 390,100 500,230 590,130" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="50" y1="270" x2="150" y2="120" stroke="#e36209" stroke-width="4" stroke-linecap="round"/>
