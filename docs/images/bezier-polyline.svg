  <rect x="24" y="320" width="592" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <line x1="40" y1="342" x2="72" y2="342" stroke="#1f6feb" stroke-width="4" stroke-linecap="round"/>
  <text x="82" y="347" font-size="14" fill="#24292f">ベジエ曲線 (前後の点が揃っている区間)</text>
  <line x1="350" y1="342" x2="382" y2="342" stroke="#e36209" stroke-width="4" stroke-linecap="round"/>
  <text x="392" y="347" font-size="14" fill="#24292f">直線 (最初と最後の区間)</text>
  <rect x="52" y="360" width="8" height="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="82" y="370" font-size="14" fill="#24292f">制御点。n 個の通過点から n − 3 個のベジエ区間ができる</text>
