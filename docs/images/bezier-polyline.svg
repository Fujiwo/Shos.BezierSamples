  <rect x="348.2" y="96.5" width="7" height="7" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <line x1="390" y1="100" x2="428.3" y2="100" stroke="#8c959f" stroke-width="1"/>
  <line x1="500" y1="230" x2="466.7" y2="225" stroke="#8c959f" stroke-width="1"/>
  <path d="M390,100 C428.3,100 466.7,225 500,230" fill="none" stroke="#1f6feb" stroke-width="4" stroke-linecap="round"/>
  <rect x="424.8" y="96.5" width="7" height="7" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <rect x="463.2" y="221.5" width="7" height="7" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
