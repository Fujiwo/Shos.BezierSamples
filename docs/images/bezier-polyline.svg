  <text x="50" y="298" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">P0</text>
  <circle cx="150" cy="120" r="5" fill="#24292f"/>
  <text x="150" y="104" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">P1</text>
  <circle cx="270" cy="230" r="5" fill="#24292f"/>
  <text x="270" y="260" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">P2</text>
  <circle cx="390" cy="100" r="5" fill="#24292f"/>
  <text x="390" y="84" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">P3</text>
  <circle cx="500" cy="230" r="5" fill="#24292f"/>
  <text x="500" y="260" font-size="16" font-weight="600" fill="#24292f" text-anchor="middle">P4</text>
  <circle cx="590" cy="130" r="5" fill="#24292f"/>
